name: todolist
description: "Todolist CaoThang - A Flutter application for task management and daily reporting"
publish_to: 'none'

version: 1.0.0+7

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase Suite
  firebase_auth: ^6.1.0
  firebase_core: ^4.1.1
  firebase_database: ^12.0.2
  firebase_messaging: ^16.0.2
  firebase_analytics: ^12.0.2
  firebase_crashlytics: ^5.0.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  
  # State Management
  get: ^4.6.6
  
  # Local Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  
  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  
  # UI Components & Icons
  cupertino_icons: ^1.0.6
  material_design_icons_flutter: ^7.0.7296
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  
  # Date & Time
  intl: ^0.18.1
  timezone: ^0.10.1
  
  # OneDrive Integration (Auth via OAuth2 PKCE)
  flutter_appauth: ^6.0.4
  flutter_secure_storage: ^9.2.2
  flutter_onedrive: ^1.8.1
  
  # Utilities
  uuid: ^4.2.1
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  device_info_plus: ^9.1.1
  url_launcher: ^6.3.1
  
  # Notifications
  flutter_local_notifications: ^19.4.2
  
  # Charts & Analytics
  fl_chart: ^0.66.0
  syncfusion_flutter_charts: ^23.2.7
  
  # Functional Programming
  dartz: ^0.10.1
  equatable: ^2.0.5

  meta: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Testing
  mockito: ^5.4.4
  build_runner: ^2.4.7
  
  # Code Quality
  flutter_lints: ^6.0.0
  very_good_analysis: ^10.0.0
  
  # Code Generation
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  
  # Icon and Splash Screen Generation
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
  firebase_database_platform_interface: any
  firebase_auth_platform_interface: any
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon_trans_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 30
#  web:
#    generate: true
#    image_path: "assets/icons/app_icon_white_1024.png"
#    background_color: "#05812d"
#    theme_color: "#05812d"
#  windows:
#    generate: true
#    image_path: "assets/icons/app_icon_white_1024.png"
#    icon_size: 48
#  macos:
#    generate: true
#    image_path: "assets/icons/app_icon_white_1024.png"

# Flutter Native Splash Configuration
flutter_native_splash:
   color: "#FFFFFF"
   image: assets/icons/app_icon_trans_1024.png
#   branding: assets/icons/app_icon_trans_1024.png
   color_dark: "#FFFFFF"
   image_dark: assets/icons/app_icon_trans_1024.png
#   branding_dark: assets/icons/app_icon_trans_1024.png
   android_12:
     image: assets/icons/app_icon_trans_1024.png
     color: "#FFFFFF"
     image_dark: assets/icons/app_icon_trans_1024.png
     color_dark: "#FFFFFF"
   web: false
   android: true
   ios: true
