name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Create Release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Run tests
      run: flutter test --coverage
      
    - name: Build Android APK
      run: flutter build apk --release
      
    - name: Build Android App Bundle
      run: flutter build appbundle --release
      
    - name: Build Web
      run: flutter build web --release
      
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
        body: |
          ## What's Changed
          
          ### Features
          - New features and improvements
          
          ### Bug Fixes
          - Bug fixes and stability improvements
          
          ### Documentation
          - Documentation updates
          
          ## Downloads
          
          ### Android
          - **APK**: Download the APK file below for direct installation
          - **App Bundle**: Use the AAB file for Google Play Store upload
          
          ### Web
          - **Web App**: Deployed to Firebase Hosting
          
          ## Installation
          
          ### Android
          1. Download the APK file
          2. Enable "Install from unknown sources" in your device settings
          3. Install the APK file
          
          ### Web
          Visit the web app at: https://todolist-app.web.app
          
          ## Changelog
          See the full changelog in the repository.
        files: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/bundle/release/app-release.aab
          build/web/

  # Deploy to Firebase Hosting
  deploy-web:
    name: Deploy Web to Firebase
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build Web
      run: flutter build web --release
      
    - name: Deploy to Firebase Hosting
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        channelId: live
        projectId: todolist-app

  # Deploy to Google Play Store
  deploy-android:
    name: Deploy Android to Play Store
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '11'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build App Bundle
      run: flutter build appbundle --release
      
    - name: Deploy to Google Play Store
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        packageName: com.example.todolist
        releaseFiles: build/app/outputs/bundle/release/app-release.aab
        track: production
        status: completed
        inAppUpdatePriority: 2

  # Deploy to App Store
  deploy-ios:
    name: Deploy iOS to App Store
    runs-on: macos-latest
    needs: create-release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build iOS
      run: flutter build ios --release
      
    - name: Deploy to App Store
      uses: apple-actions/upload-app-store@v1
      with:
        app-path: build/ios/iphoneos/Runner.app
        api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
        api-issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
        api-private-key: ${{ secrets.APPLE_API_PRIVATE_KEY }}

  # Notify Teams
  notify:
    name: Notify Teams
    runs-on: ubuntu-latest
    needs: [deploy-web, deploy-android, deploy-ios]
    if: always()
    
    steps:
    - name: Notify Slack
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#releases'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
      if: always()
      
    - name: Notify Teams
      uses: skitionek/notify-microsoft-teams@master
      with:
        webhook_url: ${{ secrets.TEAMS_WEBHOOK }}
        title: 'Release ${{ github.ref }}'
        summary: 'New release has been deployed'
        text: |
          **Release**: ${{ github.ref }}
          **Status**: ${{ job.status }}
          **Web**: Deployed to Firebase Hosting
          **Android**: Deployed to Google Play Store
          **iOS**: Deployed to App Store
      if: always()
